name: Build
on: [push, pull_request]

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-22.04
    # We use a clean container to avoid LLVM conflicts on the GH runner images
    container:
      image: ubuntu:22.04
    steps:
        - name: Install build tools
          run: |
            apt update
            apt install --no-install-recommends -y \
              ca-certificates \
              cmake \
              ninja-build \
              python-is-python3 \
              python3-pip \
              python3-setuptools \
              python3-venv \
              git \
              build-essential

        - name: Checkout
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Add workspace as safe directory (necessary for docker)
          run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

        - name: Build dependencies
          run: |
            cmake -G Ninja -S dependencies -B dependencies/build -DCMAKE_BUILD_TYPE=Release
            cmake --build dependencies/build

        - name: Build project
          run: |
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              "-DCMAKE_C_COMPILER=$PWD/dependencies/install/bin/clang" \
              "-DCMAKE_CXX_COMPILER=$PWD/dependencies/install/bin/clang++"
            cmake --build build

        - name: Run example
          run: |
            build/remill-example

  macos:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: macos-latest
    steps:
        - name: Install build tools
          run: |
            brew install ninja

        - name: Checkout
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Build dependencies
          run: |
            cmake -G Ninja -S dependencies -B dependencies/build -DCMAKE_BUILD_TYPE=Release
            cmake --build dependencies/build

        - name: Build project
          run: |
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              "-DCMAKE_C_COMPILER=$PWD/dependencies/install/bin/clang" \
              "-DCMAKE_CXX_COMPILER=$PWD/dependencies/install/bin/clang++"
            cmake --build build

        - name: Run example
          run: |
            build/remill-example

  windows:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: windows-latest
    steps:
        - name: Visual Studio Developer Command Prompt
          uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

        - name: Checkout
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Build dependencies
          run: |
            cmake -G Ninja -S dependencies -B dependencies/build -DCMAKE_BUILD_TYPE=Release
            cmake --build dependencies/build
          shell: pwsh

        - name: Build project
          run: |
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              "-DCMAKE_C_COMPILER=$PWD/dependencies/install/bin/clang-cl.exe" `
              "-DCMAKE_CXX_COMPILER=$PWD/dependencies/install/bin/clang-cl.exe"
            cmake --build build
          shell: pwsh

        - name: Run example
          run: |
            build/remill-example.exe
          shell: pwsh
